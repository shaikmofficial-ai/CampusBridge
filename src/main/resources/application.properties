spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true




# Secret must be at least 32 characters for HS256
jwt.secret=campusbridge_mgr_super_secret_key_minimum_32chars
jwt.expiration=86400000

server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Adzuna job feed (https://developer.adzuna.com/) ---
# Get a free app id + key and set them as environment variables
# (ADZUNA_APP_ID / ADZUNA_APP_KEY) or paste them here.
adzuna.app-id=${ADZUNA_APP_ID:}
adzuna.app-key=${ADZUNA_APP_KEY:}
adzuna.country=in
adzuna.results-per-page=20
adzuna.default-queries=software developer,data analyst,full stack developer,java developer,frontend developer
# Refresh schedule (cron): default 06:00 and 18:00 daily
adzuna.refresh-cron=0 0 6,18 * * *

# --- VirusTotal malware scanning (https://www.virustotal.com/) ---
# Optional. Leave disabled if you don't have a key; uploads still work and are
# validated by Apache Tika. Set VIRUSTOTAL_API_KEY and flip enabled=true to scan.
virustotal.enabled=${VIRUSTOTAL_ENABLED:false}
virustotal.api-key=${VIRUSTOTAL_API_KEY:}
# Poll the verdict up to N times, waiting M ms between polls (blocks the upload
# until the scan completes so malicious files are rejected).
virustotal.poll-attempts=${VIRUSTOTAL_POLL_ATTEMPTS:10}
virustotal.poll-interval-ms=${VIRUSTOTAL_POLL_INTERVAL_MS:3000}

# --- Judge0 code execution (https://judge0.com / RapidAPI) ---
# Free via RapidAPI: subscribe to Judge0 CE and paste the key below.
# Self-hosted CE instances usually need only judge0.base-url.
judge0.base-url=${JUDGE0_BASE_URL:https://judge0-ce.p.rapidapi.com}
judge0.api-key=${JUDGE0_API_KEY:}
judge0.api-host=${JUDGE0_API_HOST:judge0-ce.p.rapidapi.com}

# --- Google Gemini AI assistant ---
# SECURITY: never hard-code the key here. Set the GEMINI_API_KEY environment
# variable (e.g. export GEMINI_API_KEY=your_key). If unset, the AI panel
# gracefully serves pre-written fallback content.
# NOTE: gemini-1.5-flash was retired from v1beta -> use gemini-2.0-flash.
# Override the model via GEMINI_BASE_URL if Google rotates names again.
gemini.api.key=${GEMINI_API_KEY:}
gemini.base.url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}